
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETRO PING PONG 1972</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>RETRO PING PONG</h1>

        <p>===== SYSTEM 1972 =====</p>
        <p>WELCOME TO THE CLASSIC TENNIS GAME</p>

        <h2 id="score">0 : 0</h2>

        <canvas id="game" width="600" height="350"></canvas>

        <br>

        <button onclick="startGame()">START GAME</button>
        <button onclick="resetGame()">RESET</button>

        <p>PLAYER 1: W / S</p>
        <p>PLAYER 2: ARROW UP / ARROW DOWN</p>

        <p>--------------------------------</p>
        <p>OLD SCHOOL PROGRAMMING STYLE</p>
        <p>YEAR: 1972</p>

    </div>

    <script src="script.js"></script>

</body>
</html>
